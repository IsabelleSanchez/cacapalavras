<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palavra do Dia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">Jogo casual</p>
          <h1>Palavra do Dia</h1>
        </div>

        <div class="header-controls">
          <button id="dailyToggle" class="toggle active" type="button">Diário</button>
          <button id="randomToggle" class="toggle" type="button">Aleatório</button>
        </div>
      </header>

      <section class="stats" aria-label="Estatísticas do jogador">
        <article class="stat-box">
          <strong id="streakValue">0</strong>
          <span>streak</span>
        </article>
        <article class="stat-box">
          <strong id="winsValue">0</strong>
          <span>vitórias</span>
        </article>
        <article class="stat-box">
          <strong id="playedValue">0</strong>
          <span>jogadas</span>
        </article>
      </section>

      <section class="game-panel" aria-live="polite">
        <div id="board" class="board" aria-label="Tabuleiro de adivinhação"></div>

        <div id="keyboard" class="keyboard" aria-label="Teclado virtual"></div>

        <div id="status" class="status" aria-live="polite"></div>

        <div class="action-row">
          <button id="newGameBtn" class="primary-btn" type="button">Nova rodada</button>
          <button id="shareBtn" class="secondary-btn" type="button">Compartilhar</button>
        </div>
      </section>
    </main>

    <div id="resultModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <p class="modal-tag">Resultado</p>
        <h2 id="modalTitle">Partida finalizada</h2>
        <p id="modalMessage">Você venceu!</p>
        <div class="modal-actions">
          <button id="modalPlayAgain" class="primary-btn" type="button">Jogar outra vez</button>
          <button id="modalShare" class="secondary-btn" type="button">Compartilhar</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
